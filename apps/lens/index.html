<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Paladeium — AR Menu</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <!-- ES Module Shims: Polyfill for import maps in older browsers (e.g. iOS < 16.4) -->
  <!-- NOTE: Must NOT have `async` — the shim must execute before any import() calls -->
  <script src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

  <!-- Importmap for Three.js and MindAR -->
  <script type="importmap">
  {
    "imports": {
      "three":              "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/":      "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold:    #D4A853;
      --gold-lt: #F0C97A;
      --dark:    #0A0A0F;
      --card-bg: rgba(10, 10, 20, 0.82);
      --border:  rgba(212, 168, 83, 0.25);
      --text:    #F0EDE8;
      --muted:   rgba(240,237,232,0.55);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── AR Canvas Container ─── */
    #ar-container {
      position: fixed; inset: 0;
      z-index: 0;
    }
    #ar-container > canvas.mindar-canvas {
      width: 100% !important;
      height: 100% !important;
    }
    #demo-canvas {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }


    
    /* ─── Info Card ─── */
    #info-card {
      position: fixed;
      bottom: 110px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 35;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 20px;
      width: 90%; max-width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      opacity: 0; pointer-events: none;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #info-card.visible {
      opacity: 1; pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .info-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 6px;
    }
    .info-name {
      font-size: 16px; font-weight: 700; color: var(--text);
    }
    .info-price {
      font-size: 16px; font-weight: 700; color: var(--gold);
      font-family: 'Playfair Display', serif;
    }
    .info-desc {
      font-size: 12px; color: var(--muted); line-height: 1.4;
    }

    /* ─── Top Status Bar ─── */
    #status-bar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 12px;
      background: linear-gradient(180deg, rgba(10,10,15,0.9) 0%, transparent 100%);
      pointer-events: none;
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 17px; font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--gold);
    }
    .brand span { color: var(--text); font-weight: 300; }
    #anchor-status {
      font-size: 11px; font-weight: 500; letter-spacing: 0.6px;
      padding: 4px 10px; border-radius: 20px;
      background: rgba(212,168,83,0.12);
      border: 1px solid var(--border);
      color: var(--muted);
      display: flex; align-items: center; gap: 6px;
      transition: all 0.4s ease;
    }
    #anchor-status.found {
      background: rgba(80,200,80,0.12);
      border-color: rgba(80,200,80,0.35);
      color: rgb(140,230,140);
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* ─── Floating Menu Panel ─── */
    #menu-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 40;
      transform: translateY(100%);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 0 12px 20px;
    }
    #menu-panel.visible { transform: translateY(0); }
    #menu-panel.minimized { transform: translateY(calc(100% - 70px)); }

    .menu-handle-container {
      width: 100%;
      cursor: pointer;
      padding-top: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .menu-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: var(--border);
      margin: 0 auto 14px;
    }

    .menu-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 18px 16px;
      box-shadow: 0 -8px 48px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(255,255,255,0.04);
    }

    .menu-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 16px;
    }
    .menu-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-weight: 700;
      color: var(--text);
    }
    .menu-header .subtitle {
      font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--gold); font-weight: 500;
    }

    /* Category pills */
    .categories {
      display: flex; gap: 8px;
      overflow-x: auto; margin-bottom: 16px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0;
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.3px;
      border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-pill.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #0A0A0F; font-weight: 600;
    }

    /* Dish grid */
    .dish-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .dish-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      cursor: pointer;
      transition: all 0.22s ease;
      position: relative;
      overflow: hidden;
    }
    .dish-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(212,168,83,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .dish-card:active { transform: scale(0.97); }
    .dish-card.active {
      border-color: var(--gold);
      background: rgba(212,168,83,0.08);
    }
    .dish-card.active::before { opacity: 1; }

    .dish-emoji { font-size: 28px; margin-bottom: 8px; display: block; }
    .dish-name {
      font-size: 13px; font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .dish-desc {
      font-size: 10px; color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .dish-price {
      font-size: 14px; font-weight: 700;
      color: var(--gold);
      font-family: 'Playfair Display', serif;
    }
    .dish-ar-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 9px; font-weight: 600; letter-spacing: 0.5px;
      padding: 2px 7px; border-radius: 6px;
      background: rgba(212,168,83,0.15);
      border: 1px solid rgba(212,168,83,0.3);
      color: var(--gold);
    }

    /* ─── 3D Viewer Hint ─── */
    #ar-hint {
      position: fixed; bottom: 380px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 45;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 8px 18px;
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
      opacity: 0;
      transition: all 0.5s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #ar-hint.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #ar-hint .hint-icon { font-size: 16px; }

    /* ─── No Anchor Prompt ─── */
    #no-anchor-msg {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      z-index: 45;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 22px;
      text-align: center;
      font-size: 13px; color: var(--muted);
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
    }
    #no-anchor-msg.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    #no-anchor-msg .icon { font-size: 28px; margin-bottom: 8px; }
    #no-anchor-msg p { line-height: 1.5; }
    #no-anchor-msg strong { color: var(--gold); }

    /* ─── Surface Mode ─── */
    #surface-controls {
      position: fixed; bottom: 380px; left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      display: none;
      gap: 10px;
      align-items: center;
    }
    #surface-reposition-btn {
      background: rgba(10,10,20,0.82);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 10px 22px;
      font-size: 13px; font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #surface-reposition-btn:active { transform: scale(0.96); }

    #surface-tap-hint {
      position: fixed; bottom: 380px; left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 10px 22px;
      font-size: 13px; font-weight: 500;
      color: var(--text);
      display: none;
      align-items: center; gap: 8px;
      white-space: nowrap;
      pointer-events: none;
    }
    #surface-tap-hint.visible { display: flex; }
    .tap-pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold);
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* ─── Loading Spinner ─── */
    /* ─── Skeleton Loading ─── */
    #model-loading {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 60;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #model-loading.visible { opacity: 1; }
    
    .skeleton-card {
      background: rgba(10, 10, 20, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 220px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .skeleton-image {
      width: 100%; height: 120px;
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(212,168,83,0.1) 25%, rgba(212,168,83,0.2) 50%, rgba(212,168,83,0.1) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
    }
    .skeleton-line {
      height: 12px; width: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(212,168,83,0.1) 25%, rgba(212,168,83,0.2) 50%, rgba(212,168,83,0.1) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
    }
    .skeleton-line.short { width: 60%; }
    
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ─── Tutorial Overlay ─── */
    #tutorial-overlay {
      position: fixed; inset: 0;
      z-index: 55;
      background: rgba(0, 0, 0, 0.4);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #tutorial-overlay.visible {
      opacity: 1; pointer-events: auto;
    }
    .tutorial-hand {
      font-size: 54px;
      animation: swipe-hand 2s ease-in-out infinite;
      margin-bottom: 20px;
    }
    .tutorial-text {
      font-size: 16px; font-weight: 600; color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
    }
    @keyframes swipe-hand {
      0% { transform: translateX(50px) rotate(10deg); opacity: 0; }
      20% { transform: translateX(50px) rotate(10deg); opacity: 1; }
      80% { transform: translateX(-50px) rotate(-10deg); opacity: 1; }
      100% { transform: translateX(-50px) rotate(-10deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="ar-container"></div>

  <!-- Top bar -->
  <div id="status-bar">
    <div class="brand">Paladeium<span> Lens</span></div>
    <div id="anchor-status">
      <div class="dot"></div>
      <span id="status-text">Scanning…</span>
    </div>
  </div>



  <!-- No-anchor prompt -->
  <div id="no-anchor-msg">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
      </svg>
    </div>
    <p>Point at the <strong>menu card</strong> first so the dish appears in AR</p>
  </div>

  <!-- Surface mode: tap hint + reposition -->
  <div id="surface-tap-hint">
    <div class="tap-pulse"></div>
    <span id="surface-hint-text">Tap surface to place</span>
  </div>
  <div id="surface-controls">
    <button id="surface-reposition-btn" onclick="repositionSurface()">Reposition</button>
  </div>

  <!-- Skeleton Loading -->
  <div id="model-loading">
    <div class="skeleton-card">
      <div class="skeleton-image"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line short"></div>
    </div>
  </div>

  <!-- Tutorial Overlay -->
  <div id="tutorial-overlay">
    <div class="tutorial-hand">👆</div>
    <div class="tutorial-text">Swipe left or right to switch dishes</div>
  </div>

  <!-- Floating Info Card -->
  <div id="info-card">
    <div class="info-header">
      <div class="info-name">Dish Name</div>
      <div class="info-price">₹0</div>
    </div>
    <div class="info-desc">Description</div>
  </div>

  <!-- Drag / pinch hint -->
  <div id="ar-hint">
    <span>Swipe left/right to change dish</span>
  </div>

  <!-- Floating bottom menu panel -->
  <div id="menu-panel">
    <div class="menu-handle-container" id="menu-toggle">
      <div class="menu-handle"></div>
    </div>
    <div class="menu-card">
      <div class="menu-header">
        <h3>Our Menu</h3>
        <span class="subtitle">Tap to view in AR</span>
      </div>
      <div class="categories" id="categories">
        <button class="cat-pill active" data-cat="all">All</button>
      </div>
      <div class="dish-grid" id="dish-grid"></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script type="module">
    import { ARSessionManager } from './js/ARSessionManager.js';
    import { State, setState } from './js/StateManager.js';

    const DASHBOARD_API = window.__PALADEIUM_API__ || 'http://localhost:3000';
    
    let MENU = [
      { id:'burger', name:'Wagyu Smash Burger', desc:'Double patty, aged cheddar, truffle aioli', price:'₹649', emoji:'🍔', cat:'mains', model:'models/the-grand-spice/burger.glb', hasAR:true },
      { id:'pizza',  name:'Margherita Classico',  desc:'San Marzano tomato, buffalo mozzarella',  price:'₹549', emoji:'🍕', cat:'mains',    model:null,         hasAR:false },
      { id:'pasta',  name:'Cacio e Pepe',         desc:'Tonnarelli, romano, tellicherry pepper',  price:'₹479', emoji:'🍝', cat:'mains',    model:null,         hasAR:false },
      { id:'salad',  name:'Caesar Deluxe',        desc:'Romaine, house dressing, parmesan crisp', price:'₹329', emoji:'🥗', cat:'starters', model:null,         hasAR:false },
    ];

    async function fetchMenu() {
      const slug = new URLSearchParams(location.search).get('r');
      setState({ restaurantSlug: slug });
      if (slug) {
        try {
          const res = await fetch(`${DASHBOARD_API}/api/restaurants/${slug}/menu`);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data.menu) && data.menu.length) {
              MENU = data.menu.map(item => ({
                id:    item.id,
                name:  item.name,
                desc:  item.description ?? item.desc ?? '',
                price: typeof item.price === 'number' ? '₹' + item.price : (item.price ?? ''),
                emoji: item.emoji ?? '',
                cat:   (item.categoryId ?? item.cat ?? 'mains').toLowerCase(),
                model: item.modelUrl ?? item.model ?? null,
                modelScale: item.modelScale ?? 1.0,
                hasAR: item.hasAr ?? item.hasAR ?? false,
              }));
            }
          }
        } catch {
          console.warn('[Paladeium] API unavailable — using default menu');
        }
      }
      // Filter out dishes without AR model for the AR viewer
      const arMenu = MENU.filter(m => m.hasAR && m.model);
      setState({ menuItems: arMenu });
    }

    async function init() {
      await fetchMenu();

      // Setup camera background
      const video = document.createElement('video');
      video.autoplay = true; video.muted = true; video.playsInline = true;
      video.style.position = 'fixed';
      video.style.top = '0'; video.style.left = '0';
      video.style.width = '100%'; video.style.height = '100%';
      video.style.objectFit = 'cover';
      video.style.zIndex = '-1';
      document.body.appendChild(video);
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
      } catch(e) {
        console.warn('Camera preview failed', e);
      }
      
      // Show skeleton initially
      const modelLoading = document.getElementById('model-loading');
      if (modelLoading) modelLoading.classList.add('visible');

      const statusText = document.getElementById('status-text');
      let arStarted = false;

      const startAR = async () => {
        if(arStarted) return;
        arStarted = true;
        statusText.textContent = 'Starting AR...';
        
        try {
          // MUST release camera hardware before WebXR can use it!
          if (video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.stop());
          }
          video.remove();

          const arManager = new ARSessionManager();
          await arManager.start();
          statusText.textContent = 'Scanning for surfaces...';
        } catch (e) {
          console.error(e);
          alert('Failed to start AR: ' + e.message);
        }
      };

      // Trigger WebXR on any first interaction
      document.addEventListener('touchstart', startAR, { once: true, capture: true });
      document.addEventListener('click', startAR, { once: true, capture: true });
    }

    init();
  </script>
</body>
</html>
